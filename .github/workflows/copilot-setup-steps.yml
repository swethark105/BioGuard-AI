name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # BioGuard AI has no build step. Start the app so the agents can open it
    # at http://localhost:3000 (the baseURL in playwright.config.ts).
    - name: Start BioGuard AI app
      # The app listens on IPv4 only, so check 127.0.0.1 (localhost can
      # resolve to the IPv6 address ::1 on the runner).
      run: |
        nohup node app/server.js > app.log 2>&1 &
        for i in $(seq 1 30); do
          curl -fsS http://127.0.0.1:3000/health && exit 0
          sleep 1
        done
        echo "App did not start:"; cat app.log; exit 1
